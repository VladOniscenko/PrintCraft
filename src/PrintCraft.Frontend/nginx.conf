server {
    listen 80;
    server_name _;
    client_max_body_size 50m;
    charset utf-8;

    # 1. 301 Redirect WWW to non-WWW
    if ($host = "www.printmy3d.work") {
        return 301 https://printmy3d.work$request_uri;
    }

    # 2. 301 Redirect HTTP to HTTPS behind reverse proxy / Cloudflare Tunnel
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Global Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.googletagmanager.com https://*.google-analytics.com https://static.cloudflareinsights.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://printmy3d.work https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://stats.g.doubleclick.net https://region1.google-analytics.com; frame-src 'self' https://*.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Performance & Socket settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        text/xml
        image/svg+xml
        font/woff2
        model/stl
        model/obj
        model/gltf+json
        model/gltf-binary
        application/octet-stream
        application/wasm;

    # Cache static Vite assets permanently (filenames are content-hashed)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Cache self-hosted web fonts permanently
    location ^~ /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Cache hero assets and static media with long cache (1 year immutable)
    location ^~ /uploads/hero/ {
        root /usr/share/nginx/html;
        try_files $uri @proxy_hero;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location @proxy_hero {
        proxy_pass http://printcraft-api:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_ignore_headers Cache-Control Expires X-Accel-Expires;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Proxy uploads directly to ASP.NET backend
    location ^~ /uploads/ {
        proxy_pass http://printcraft-api:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";

        # Disable buffering for large 3D file downloads & streaming
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800;
        proxy_connect_timeout 1800;
        proxy_send_timeout 1800;
    }

    # Proxy API requests directly to ASP.NET backend
    location ^~ /api/ {
        proxy_pass http://printcraft-api:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for API proxy requests
        proxy_read_timeout 1800;
        proxy_connect_timeout 1800;
        proxy_send_timeout 1800;
    }

    # Cache images and static 3d model assets in the frontend container
    location ~* \.(?:ico|svg|png|jpg|jpeg|gif|webp|woff2?|stl|3mf|obj|glb|gltf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # Ensure index.html carries full security headers and fresh cache-control
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.googletagmanager.com https://*.google-analytics.com https://static.cloudflareinsights.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://printmy3d.work https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://stats.g.doubleclick.net https://region1.google-analytics.com; frame-src 'self' https://*.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;
        expires -1;
    }

    # Agentic & Crawler files with regex matching for root and localized prefixes
    location ~* /(?:ai-catalog|ard)\.json$ {
        alias /usr/share/nginx/html/ai-catalog.json;
        add_header Content-Type "application/json; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    location ~* /llms\.txt$ {
        alias /usr/share/nginx/html/llms.txt;
        add_header Content-Type "text/markdown; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    location ~* /llms-full\.txt$ {
        alias /usr/share/nginx/html/llms-full.txt;
        add_header Content-Type "text/markdown; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    location = /robots.txt {
        try_files $uri =404;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        access_log off;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Content-Type "application/xml; charset=utf-8";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        access_log off;
    }

    # Service worker must remain fresh to enable seamless updates
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        expires -1;
        access_log off;
    }

    # High-Performance Caching for Pre-rendered Static Pages (Home, FAQ, Topic Pages, Cities, Policies)
    # Allows Cloudflare / Edge CDN caching (s-maxage=3600) and browser caching (max-age=600) with instant stale-while-revalidate
    location ~* ^/(?:(?:[a-z]{2}/)?(?:$|faq(?:/.*)?|3d-print-service(?:/.*)?|privacy|terms|refunds|shipping-policy))$ {
        try_files $uri $uri/ /index.html;
        etag on;
        add_header Cache-Control "public, max-age=600, s-maxage=3600, stale-while-revalidate=86400, stale-if-error=604800" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.googletagmanager.com https://*.google-analytics.com https://static.cloudflareinsights.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://printmy3d.work https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://stats.g.doubleclick.net https://region1.google-analytics.com; frame-src 'self' https://*.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    }

    # Private and transactional routes: prevent caching of dynamic user content
    location ~* ^/(?:[a-z]{2}/)?(?:admin|orders|profile|checkout|login|register|reset-password)(?:/.*)?$ {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.googletagmanager.com https://*.google-analytics.com https://static.cloudflareinsights.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://printmy3d.work https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://stats.g.doubleclick.net https://region1.google-analytics.com; frame-src 'self' https://*.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.googletagmanager.com https://*.google-analytics.com https://static.cloudflareinsights.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://printmy3d.work https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://stats.g.doubleclick.net https://region1.google-analytics.com; frame-src 'self' https://*.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    }
}
