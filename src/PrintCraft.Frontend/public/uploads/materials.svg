<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#092019" />
      <stop offset="50%" stop-color="#0f3d32" />
      <stop offset="100%" stop-color="#051712" />
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="24" fill="url(#bgGrad)" />

  <!-- Decorative Grid Overlay -->
  <g opacity="0.08" stroke="#34d399" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="280" cy="260" r="140" fill="#10b981" opacity="0.15" filter="url(#glow)" />
  <circle cx="520" cy="340" r="160" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />

  <!-- 3D Filament Spools Illustration -->
  <!-- Spool 1 (Left: Emerald / Tough PLA) -->
  <g transform="translate(180, 290)">
    <ellipse cx="0" cy="0" rx="90" ry="120" fill="#06221a" stroke="#10b981" stroke-width="4" />
    <ellipse cx="0" cy="0" rx="70" ry="95" fill="#0f4336" />
    <!-- Filament wound layers -->
    <path d="M-60,-80 C-40,-85 40,-85 60,-80 L60,80 C40,85 -40,85 -60,80 Z" fill="#10b981" opacity="0.85" />
    <ellipse cx="0" cy="0" rx="36" ry="50" fill="#06221a" stroke="#34d399" stroke-width="3" />
    <text x="0" y="5" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">PLA+</text>
  </g>

  <!-- Spool 2 (Center: Cyan / Carbon PETG) -->
  <g transform="translate(400, 240)">
    <ellipse cx="0" cy="0" rx="100" ry="135" fill="#08202c" stroke="#06b6d4" stroke-width="4" />
    <ellipse cx="0" cy="0" rx="80" ry="110" fill="#0e3d54" />
    <path d="M-70,-95 C-45,-100 45,-100 70,-95 L70,95 C45,100 -45,100 -70,95 Z" fill="url(#cyanGrad)" opacity="0.9" />
    <ellipse cx="0" cy="0" rx="40" ry="56" fill="#08202c" stroke="#38bdf8" stroke-width="3" />
    <text x="0" y="6" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">PETG-CF</text>
  </g>

  <!-- Spool 3 (Right: Orange / Flexible TPU) -->
  <g transform="translate(610, 310)">
    <ellipse cx="0" cy="0" rx="85" ry="115" fill="#241407" stroke="#f59e0b" stroke-width="4" />
    <ellipse cx="0" cy="0" rx="65" ry="90" fill="#452309" />
    <path d="M-55,-75 C-35,-80 35,-80 55,-75 L55,75 C35,80 -35,80 -55,75 Z" fill="url(#amberGrad)" opacity="0.85" />
    <ellipse cx="0" cy="0" rx="34" ry="46" fill="#241407" stroke="#fbbf24" stroke-width="3" />
    <text x="0" y="5" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">TPU 95A</text>
  </g>

  <!-- Floating Filament Spec Badges -->
  <g transform="translate(400, 470)">
    <!-- Badge 1 -->
    <rect x="-290" y="0" width="165" height="42" rx="21" fill="#06221a" stroke="#10b981" stroke-width="1.5" />
    <circle cx="-272" cy="21" r="6" fill="#10b981" />
    <text x="-256" y="26" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="13" font-weight="600">High Rigidity</text>

    <!-- Badge 2 -->
    <rect x="-85" y="0" width="170" height="42" rx="21" fill="#08202c" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="-67" cy="21" r="6" fill="#06b6d4" />
    <text x="-51" y="26" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Chemical Resist</text>

    <!-- Badge 3 -->
    <rect x="125" y="0" width="165" height="42" rx="21" fill="#241407" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="143" cy="21" r="6" fill="#f59e0b" />
    <text x="159" y="26" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Impact Dampening</text>
  </g>

  <!-- Header Accent Line -->
  <text x="400" y="80" fill="url(#neonEmerald)" font-family="system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="2" text-anchor="middle">PREMIUM 3D PRINTING FILAMENTS</text>
  <text x="400" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Industrial grade polymer spools optimized for speed and mechanical endurance</text>
</svg>
